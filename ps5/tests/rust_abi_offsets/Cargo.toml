# PSGopher - the FreeBSD 12 structures as Rust's libc has them (ps5/tests/test_rust_abi.c compares
# ps5/host/rust_abi.c's with these). Built for x86_64-unknown-freebsd; only offsets, no code to run
# there.
[package]
name = "rust_abi_offsets"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
libc = { version = "=0.2.191", default-features = false }

[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"
